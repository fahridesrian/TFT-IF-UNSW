[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nids-tft-if"
version = "0.1.0"
description = "Hybrid Isolation Forest + Temporal Fusion Transformer NIDS on UNSW-NB15"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "scikit-learn>=1.3",
    "optuna>=3.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "tqdm>=4.65",
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]
